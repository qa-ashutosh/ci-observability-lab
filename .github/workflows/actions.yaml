# Event name
name: CI

# When the workflow should run
on:
  push:
    branches:
      - "**"  # Run on all branches
  schedule:
    - cron: '0 17 * * 2'
      timezone: 'Asia/Kolkata'


# What jobs to execute
jobs:
  build_and_test:
    runs-on: ubuntu-latest

    env:
      BUILDEVENT_FILE: './buildevents.txt'  # This file is at root of our repository

    # What steps to execute within the job
    steps:

      # Set a start time
      - name: Set start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Initialize Honeycomb build events
        uses: honeycombio/gha-buildevents@v4
        with:
          apikey: ${{ secrets.BUILDEVENTS_APIKEY }}
          dataset: tau-build-pipeline
          status: ${{ job.status }}
          otel-traceid: true

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: maven

      # Introduce start of span
      - name: Telemetry start - Maven tests
        if: always()
        run: |
          echo "STEP_START=$(date +%s)" >> $GITHUB_ENV
          echo "STEP_ID='run-maven-tests'" >> $GITHUB_ENV

      # Run tests with Maven
      - name: Run tests with Maven
        run: mvn test

      # Calculate total duration and collect test data
      - name: Telemetry - Collect build data
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
#          BUILDEVENT_FILE: ${{ env.BUILDEVENT_FILE }}
        if: always()
        run: |
          # Calculate total duration
          TOTAL_DURATION=$(( $(date +%s) - START_TIME ))

          # Push duration metric to Prometheus Pushgateway
          echo "github_actions_total_duration ${TOTAL_DURATION}" | \
            curl --fail --silent --show-error \
            --data-binary @- "${PUSHGATEWAY_URL}/metrics/job/github_actions" || \
            echo "WARNING: Failed to push duration metric to Pushgateway"

          # Extract test results
          bash ./src/test/resources/test_result_script.sh
          buildevents step $TRACE_ID $STEP_ID $STEP_START $STEP_ID