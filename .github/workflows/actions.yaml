# Event name
name: CI

# When the event should run
on:
  push:
    branches:
      - "**"  #This will run on all branches, and must be quoted to be handled by yaml

# What jobs to execute
jobs:
  build_and_test:
    runs-on: ubuntu-latest

    # What steps within each job
    steps:
      # Set a start time
      - name: Set start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v2
      # Install Java
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: maven

      # Run: mvn test
      - name: Run tests with maven
        run: mvn test

      # Calculate total duration
      - name: Collect build data
        if: always()  # Make sure to run even if a previous steps fails
        run: |  # "|" means the indented lines below are part of the same command.
          echo "TOTAL_DURATION=${(expr $(date +%s) - ${START_TIME})"
        # Run the script to extract test results
          bash ./src/test/resources/test_result_script.sh



